[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantastat"
version = "0.2.0"
description = "Fantacalcio analytics and season forecasting backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.111,<1", "uvicorn[standard]>=0.30,<1", "pandas>=2.1,<3", "numpy>=1.26,<3", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
fantastat-api = "fantastat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
