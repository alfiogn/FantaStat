[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantastat"
version = "0.3.0"
description = "Fantacalcio analytics backend and local web dashboard"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0,<4",
  "pymongo>=4.8,<5",
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "requests",
  "beautifulsoup4",
  "pyyaml>=6,<7"
]

[project.scripts]
fantastat = "fantastat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
